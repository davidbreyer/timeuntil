<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="app-version" content="v20261012-2105">
  <meta name="description" content="A quiet clock. Local hours and minutes, with sixty dots counting down each minute.">
  <title>Clock — Time Until</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M16 9v7l5 3' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="clock.css?v=v20261012-2105">
  <script src="clock.js?v=v20261012-2105" defer></script>
</head>
<body>
  <nav class="clock-navigation" aria-label="Clock navigation"><a id="back-to-countdowns" href="./">Countdowns</a></nav>
  <div class="clock-controls"><label for="clock-color">Color</label><select id="clock-color"><option value="ember">Ember</option><option value="violet">Violet</option><option value="tidal">Tidal</option><option value="gold">Gold</option></select></div>
  <main aria-label="Local clock">
    <div class="minute-clock" role="timer" aria-live="off" aria-describedby="clock-detail">
      <svg class="seconds-ring" viewBox="0 0 480 480" aria-hidden="true"><g id="seconds-dots"></g></svg>
      <time id="clock-time" class="clock-time">--:--</time>
    </div>
    <p id="clock-detail" class="visually-hidden">The colored dots show the seconds remaining in this minute.</p>
  </main>
  <footer><span id="app-version" aria-label="Site version">v20261012-2105</span></footer>
</body>
</html>
